# =============================================================================
# Composite action: setup-aws-credentials
# Configura credenciales AWS temporales via OIDC para los workflows de los
# repos Skorify. Resuelve el ARN del rol federado segun la matriz de
# ADR-INFRA-0005: environment -> cuenta workload, domain -> nombre del rol.
#
# No cubre la cuenta de gestion (master): el sitio de la comunidad
# (Pagina_Web) usa aws-actions/configure-aws-credentials directo.
#
# Owner: equipo CI/CD (@steevensmelo), roles revisados por Infra (@Mateo454).
# =============================================================================

name: setup-aws-credentials
description: Configura credenciales AWS temporales via OIDC para un ambiente y dominio Skorify.

inputs:
  environment:
    description: Ambiente Skorify destino. Uno de dev | stg | prd.
    required: true
  domain:
    description: >-
      Dominio del rol. backend | frontend | frontend-infra | data | data-infra | infra | ops.
      'frontend' es el rol assets-only (sync del export); 'frontend-infra' es el
      rol del cdk deploy de la infra del frontend (ver ADR-INFRA-0003).
      'data' corre migrations contra RDS; 'data-infra' despliega los stacks CDK
      del dominio data (RDS, Lambda, SQS, EventBridge, Step Functions, DynamoDB).
      Con domain=frontend-infra o domain=data-infra el job DEBE declarar
      `environment: <ambiente>`: la trust policy exige el sub
      `repo:...:environment:<ambiente>`.
    required: true
  aws-region:
    description: Region AWS.
    required: false
    default: us-east-1

outputs:
  role-arn:
    description: ARN del rol asumido.
    value: ${{ steps.resolve.outputs.role-arn }}
  account-id:
    description: ID de la cuenta AWS resuelta.
    value: ${{ steps.resolve.outputs.account-id }}

runs:
  using: composite
  steps:
    - name: Resolver ARN del rol
      id: resolve
      shell: bash
      # Inputs van por env: + variables de shell entre comillas para evitar
      # script injection (un input controlado por el caller no se interpola
      # como código de shell). Patrón documentado en
      # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DOMAIN: ${{ inputs.domain }}
      run: |
        set -euo pipefail
        case "$INPUT_ENVIRONMENT" in
          dev) account=968306633562 ;;
          stg) account=553284493694 ;;
          prd) account=151646410766 ;;
          *) echo "::error::environment invalido: '$INPUT_ENVIRONMENT' (esperado dev|stg|prd)"; exit 1 ;;
        esac

        case "$INPUT_DOMAIN" in
          backend|frontend|data|infra) role="skorify-${INPUT_DOMAIN}-deploy" ;;
          frontend-infra)              role="skorify-frontend-infra" ;;
          data-infra)                  role="skorify-data-infra" ;;
          ops)                         role="skorify-ops-readonly" ;;
          *) echo "::error::domain invalido: '$INPUT_DOMAIN' (esperado backend|frontend|frontend-infra|data|data-infra|infra|ops)"; exit 1 ;;
        esac

        # El rol skorify-frontend-infra (y, en Pagina_Web, awsug-pagina-web-infra)
        # tiene la trust policy condicionada a sub `...:environment:<env>`, así que
        # el job que llama este action con domain=frontend-infra DEBE declarar
        # `environment: <ambiente>` o el AssumeRole fallará.

        echo "account-id=${account}" >> "$GITHUB_OUTPUT"
        echo "role-arn=arn:aws:iam::${account}:role/${role}" >> "$GITHUB_OUTPUT"
        echo "Rol resuelto: arn:aws:iam::${account}:role/${role}"

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ steps.resolve.outputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        audience: sts.amazonaws.com
        role-session-name: gh-${{ github.repository_id }}-${{ github.run_id }}
