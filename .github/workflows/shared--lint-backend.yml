name: "Shared: Lint backend (ESLint)"

on:
  workflow_call:

jobs:
  lint:
    name: ESLint backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      # Lint type-aware (project: tsconfig.base.json): deps de raiz (eslint) y
      # de server (incl. @skorify/* desde git) para resolver los tipos.
      - name: Install deps
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --dir server install --no-frozen-lockfile

      - name: ESLint
        run: pnpm run lint
