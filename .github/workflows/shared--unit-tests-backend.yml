name: "Shared: Unit tests backend (Jest)"

on:
  workflow_call:

jobs:
  test:
    name: Jest backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      - name: Jest
        working-directory: server
        run: |
          pnpm install --no-frozen-lockfile
          pnpm test
